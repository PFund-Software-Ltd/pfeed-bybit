[workspace]
authors = ["softwareentrepreneer <softwareentrepreneer+pfeed-bybit@gmail.com>"]
channels = ["conda-forge"]
name = "pfeed-bybit"
platforms = ["osx-arm64", "linux-aarch64", "linux-64", "win-64"]
# NOTE: should match with setup-pixi in ci.yml
requires-pixi = ">=0.84.1"
# FIXME: set it back to "14 days" when the package is stable
exclude-newer = "0d"

[workspace.pypi-exclude-newer]
exemptions = { afterpython = "*", uv_build = "*", pfund-blocks = "*", pfund-kit = "*", pfeed = "*", pfund-bybit = "*" }

[tasks]

[tasks.test-all]
depends-on = [
  { task = "test", environment = "py313" },
  { task = "test", environment = "py314" },
  { task = "test", environment = "py315" },
]

[dependencies]

[pypi-dependencies]
pfeed = ">=0.0.21"
pfund-bybit = ">=0.0.1"

[environments]
default = ["py313", "dev", "test"]
py313 = ["py313", "test"]
py314 = ["py314", "test"]
py315 = ["py315", "test"]

[feature.dev.pypi-dependencies]
pfeed-bybit = { path = ".", editable = true }
# pfund-bybit = { path = "../../../pfund/venues/pfund-bybit", editable = true }  # TEMP
afterpython = ">=0.4.1"

[feature.test.pypi-dependencies]
pfeed-bybit = { path = ".", editable = true }
# pfund-bybit = { path = "../../../pfund/venues/pfund-bybit", editable = true }  # TEMP
pytest = ">=9.1.1"
pytest-mock = ">=3.17.0"
pytest-xdist = ">=3.8.0"
pytest-asyncio = ">=1.4.0"
# pytest-cov = ">=7.1.0"
# pytest-recording = ">=0.14.0"
[feature.test.tasks]
test = "pytest -n auto"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"

[feature.py315.dependencies]
python = "3.15.*"
