[workspace]
authors = ["softwareentrepreneer <softwareentrepreneer+pfeed-bybit@gmail.com>"]
channels = ["conda-forge"]
name = "pfeed-bybit"
platforms = ["osx-arm64", "linux-64"]
# NOTE: should match with setup-pixi in ci.yml
requires-pixi = ">=0.81.0,<0.82.0"
# FIXME: set it back to "14 days" when the package is stable
exclude-newer = "0d"

[pypi-exclude-newer]
afterpython = "0d"
pfund = "0d"
pfeed=  "0d"
pfund-kit = "0d"

[tasks]

[tasks.test-all]
depends-on = [
  { task = "test", environment = "py312" },
  { task = "test", environment = "py313" },
  { task = "test", environment = "py314" },
  # { task = "test", environment = "py315" },
]

[dependencies]

# TEMP
[pypi-options]
prerelease-mode = "allow"

[pypi-dependencies]
pfeed = ">=0.0.20"

[environments]
default = ["py312", "dev", "test"]
py312 = ["py312", "test"]
py313 = ["py313", "test"]
py314 = ["py314", "test"]
# py315 = ["py315", "test"]

[feature.dev.pypi-dependencies]
pfeed = { path = "../pfeed", editable = true }  # TEMP
pfund = { path = "../pfund", editable = true }  # TEMP
pfeed-bybit = { path = ".", editable = true }
afterpython = ">=0.4.0"
pyrefly = ">=1.3.2"

[feature.test.pypi-dependencies]
pfeed = { path = "../pfeed", editable = true }  # TEMP
pfund = { path = "../pfund", editable = true }  # TEMP
pfeed-bybit = { path = ".", editable = true }
pytest = ">=9.1.1"
pytest-cov = ">=7.1.0"
pytest-mock = ">=3.16.0"
pytest-xdist = ">=3.8.0"
pytest-asyncio = ">=1.4.0"
pytest-recording = ">=0.14.0"
pytest-markdown-docs = ">=0.9.2"
[feature.test.tasks]
test = "pytest -n auto -m 'not rate_limit'"
test-rate-limit = "pytest -m 'rate_limit'"
test-new = "pytest --record-mode=all"  # record new interactions, useful to update recordings in case data formats returned have changed
test-ci = "pytest --record-mode=none"  # fail a test if no recording is found

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"

# [feature.py315.dependencies]
# python = "3.15.*"
